# 车机开发主要在本机做，堆内存给足；4 核机器上限制 worker，避免内存峰值过高
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1g

# AGP 9 默认内置 Kotlin 编译；本项目显式使用 Kotlin Gradle 插件，
# 与旧项目保持一致，避免 AGP 9 的 built-in Kotlin 与 KGP 2.4 相互冲突。
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
